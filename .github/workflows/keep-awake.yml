name: Keep the demo awake

# Render's free instances sleep after 15 minutes without a request, and the
# next visitor then waits about a minute for it to wake. A request every ten
# minutes keeps it up; 750 free hours a month cover one service all month.
# GitHub may delay scheduled runs, so this narrows the gaps rather than
# closing them.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_URL != '' }}
    steps:
      - name: Ping
        run: curl --silent --show-error --fail --max-time 90 --retry 2 "${{ vars.DEMO_URL }}/health"
