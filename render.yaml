# The public demo, as a Render Blueprint: one free web service built from the
# Dockerfile. The model keys are asked for when the Blueprint is created and
# are stored by Render as secrets - they are never in this repository.
services:
  - type: web
    name: ask-your-data
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The models visitors pick from; see "Choosing the model" in the
      # README. Each key is a Render secret, never in this repository.
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_DEFAULT_MODEL
        value: mistral-large
      # For visitors who add their own Gemini key on the page.
      - key: GOOGLE_API_KEY
        sync: false
      - key: AGENT_PUBLIC_MODE
        value: "true"
      # The free instance has 512 MB. Measured: six visitors running heavy
      # queries at once peaked at 254 MB with this cap, and a query that
      # needed more failed on its own instead of taking the server down.
      - key: AGENT_DUCKDB_MEMORY_LIMIT
        value: 160MB
